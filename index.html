<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Mon Programme</title>
<style>
  :root{
    --bg:#EDEEF3;
    --shell:#FFFFFF;
    --ink:#14151A;
    --muted:#8A8D98;
    --line:#EEEEF2;
    --grey-card:#F2F2F6;
    --pill-dark:#5A5D6B;
    --pill-dark-2:#3E4150;
    --glass-bg: rgba(20,21,26,.38);
    --glass-bg-strong: rgba(10,10,12,.55);
    --glass-border: rgba(255,255,255,.14);
    --glass-highlight: rgba(255,255,255,.28);
    --glass-light-bg: rgba(255,255,255,.26);
    --glass-light-border: rgba(255,255,255,.38);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% -10%, #ffffff 0%, var(--bg) 55%);
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:26px 12px;
  }

  .phone-shell{
    width:100%;
    max-width:428px;
    background:rgba(255,255,255,.4);
    backdrop-filter:blur(2px);
    border-radius:26px;
    border:1px solid rgba(20,21,26,.06);
    box-shadow:0 30px 60px -25px rgba(20,21,26,.28), 0 2px 8px rgba(20,21,26,.06);
    overflow:hidden;
    position:relative;
    height:926px;
    max-height:92vh;
    display:flex;
    flex-direction:column;
  }

  .bg-blobs{
    position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  }
  .bg-blobs span{
    position:absolute; border-radius:50%; filter:blur(60px); opacity:.55;
  }
  .bg-blobs span:nth-child(1){ width:260px; height:260px; top:-80px; left:-60px; background:#FFB4A2; }
  .bg-blobs span:nth-child(2){ width:220px; height:220px; top:120px; right:-70px; background:#A2D2FF; }
  .bg-blobs span:nth-child(3){ width:240px; height:240px; bottom:60px; left:-50px; background:#CDB4FF; }
  .bg-blobs span:nth-child(4){ width:200px; height:200px; bottom:-60px; right:-40px; background:#B7F0AE; }

  .screens{
    position:relative; z-index:1;
    flex:1;
    overflow-y:auto;
    padding:22px 20px 118px;
  }
  .screens::-webkit-scrollbar{display:none;}

  /* ---------- shared bits ---------- */
  h1.page-title{ font-size:24px; font-weight:800; margin:0 0 14px; letter-spacing:-0.01em;}
  .section-label{ font-size:13px; color:var(--muted); font-weight:600; margin:10px 2px 6px;}

  /* ---------- date strip ---------- */
  .date-strip{ display:flex; gap:8px; margin-bottom:20px; }
  .date-chip{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:transparent;
    padding:0;
    text-align:center;
    cursor:pointer;
    border:none;
    transition:transform .15s ease;
  }
  .date-chip .dnum{
    position:relative;
    width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.24);
    backdrop-filter:blur(14px) saturate(180%); -webkit-backdrop-filter:blur(14px) saturate(180%);
    border:1px solid rgba(255,255,255,.32);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.32);
    font-size:16px; font-weight:800; color:var(--ink);
    transition:background .25s ease, color .2s ease, box-shadow .25s ease;
    overflow:hidden;
  }
  .date-chip .dabbr{ font-size:10.5px; color:var(--muted); font-weight:600; display:block; transition:color .2s ease;}
  .date-chip:active{ transform:scale(.92); }
  .date-chip.active .dnum{
    background:linear-gradient(160deg, rgba(90,93,107,.38) 0%, rgba(62,65,80,.42) 60%);
    backdrop-filter:blur(14px) saturate(180%); -webkit-backdrop-filter:blur(14px) saturate(180%);
    color:#fff;
    animation:chipPop .3s ease;
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.45),
      inset 0 -6px 10px rgba(0,0,0,.2),
      0 6px 14px -6px rgba(0,0,0,.35);
  }
  .date-chip.active .dnum::before{
    content:"";
    position:absolute; top:0; left:8%; right:8%; height:45%;
    border-radius:50% 50% 60% 60%/60% 60% 100% 100%;
    background:linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0));
    pointer-events:none;
  }
  .date-chip.active .dabbr{ color:var(--ink); }
  @keyframes chipPop{ 0%{ transform:scale(.9); } 60%{ transform:scale(1.05); } 100%{ transform:scale(1); } }

  /* ---------- featured / day pastel cards ---------- */
  .feat-card{
    position:relative;
    border-radius:14px;
    padding:6px 0;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:2px;
    margin-bottom:4px;
    cursor:pointer;
    background:transparent;
    transition:transform .15s ease, opacity .2s ease;
  }
  .feat-card:active{ transform:scale(.97); opacity:.7; }
  .feat-card .photo{
    position:absolute; right:0; top:0; bottom:0; width:46%;
    background-size:cover; background-position:center 20%;
    -webkit-mask-image:linear-gradient(to right, transparent 0%, #000 42%);
    mask-image:linear-gradient(to right, transparent 0%, #000 42%);
  }
  .feat-card .kicker{ font-size:22px; font-weight:800; color:var(--ink); letter-spacing:-.01em; position:relative; z-index:2;}
  .feat-card .ftitle{ font-size:13px; font-weight:600; color:var(--muted); margin:2px 0 0; max-width:62%; line-height:1.2; position:relative; z-index:2;}
  .feat-card .corner-stats{ position:absolute; top:2px; right:2px; z-index:3; display:flex; flex-direction:column; align-items:flex-end; gap:4px;}
  .corner-pct{
    background:var(--glass-light-bg); backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
    border:1px solid var(--glass-light-border);
    color:var(--ink); font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:999px;
    box-shadow:0 3px 8px -4px rgba(20,21,26,.25);
  }
  .corner-exo{
    background:var(--glass-bg); backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
    border:1px solid var(--glass-border);
    color:#fff; font-size:9.5px; font-weight:700; padding:3px 8px; border-radius:999px;
  }

  .ex-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px;}
  .ex-tile{
    position:relative; border-radius:14px; overflow:hidden;
    aspect-ratio:1/1.05;
    display:flex; align-items:flex-end; border:1px solid var(--line);
    box-shadow:0 8px 18px -14px rgba(20,21,26,.4);
    transition:transform .15s ease;
  }
  .ex-tile:active{ transform:scale(.96); }
  .ex-tile-bg{
    position:absolute; inset:0;
    background-size:cover; background-position:center;
  }
  .ex-tile::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(20,21,26,0) 32%, rgba(20,21,26,.55) 68%, rgba(20,21,26,.9) 100%);
  }
  .ex-tile .badge{
    position:absolute; top:9px; right:9px; z-index:2;
    background:var(--glass-light-bg); backdrop-filter:blur(12px) saturate(160%); -webkit-backdrop-filter:blur(12px) saturate(160%);
    border:1px solid var(--glass-light-border);
    color:var(--ink);
    font-size:11px; font-weight:800; padding:4px 8px; border-radius:6px;
  }
  .ex-tile .nm{ position:relative; z-index:2; padding:0 10px 12px; color:#fff; font-size:12.5px; font-weight:800; text-transform:uppercase; line-height:1.2;}

  .video-card{
    border-radius:14px; overflow:hidden;
    border:1px solid rgba(255,255,255,.32);
    background:rgba(255,255,255,.22);
    backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.32), 0 8px 20px -16px rgba(20,21,26,.3);
    margin:14px 0 6px;
  }
  .video-frame-wrap{ position:relative; width:100%; aspect-ratio:16/9; background:#000; cursor:pointer;}
  .video-frame-wrap img{ width:100%; height:100%; object-fit:cover; display:block; opacity:.8;}
  .video-frame-wrap iframe{ position:absolute; inset:0; width:100%; height:100%; border:none;}
  .play-btn{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:54px; height:54px; border-radius:50%; background:rgba(255,255,255,.9); display:flex; align-items:center; justify-content:center; transition:transform .15s ease;}
  .video-frame-wrap:active .play-btn{ transform:translate(-50%,-50%) scale(.88); }
  .play-btn::before{ content:""; border-style:solid; border-width:9px 0 9px 15px; border-color:transparent transparent transparent var(--ink); margin-left:4px;}
  .video-meta{ padding:12px 14px 14px; display:flex; align-items:center; justify-content:space-between;}
  .video-meta .vt{ font-weight:800; font-size:14px;}
  .video-meta .vtag{
    font-size:10.5px; font-weight:800; letter-spacing:.04em; color:#fff;
    background:linear-gradient(160deg, var(--pill-dark-2), var(--pill-dark));
    padding:4px 9px; border-radius:6px; text-transform:uppercase;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.35);
  }

  .rest-note{
    margin-top:16px;
    background:rgba(255,255,255,.22);
    backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid rgba(255,255,255,.32);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.32);
    border-radius:14px; padding:16px; font-size:13px; color:#54565F; font-weight:600; line-height:1.5;
  }

  /* ---------- inline detail section ---------- */
  .inline-detail{ margin-top:6px; padding-top:8px; border-top:1px solid var(--line); }

  /* ---------- timer dock (floating bar at bottom) ---------- */
  .timer-dock{
    position:absolute; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:20;
    padding:12px 16px;
    background:linear-gradient(165deg, rgba(90,93,107,.38) 0%, rgba(62,65,80,.42) 55%);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border:1px solid var(--glass-border);
    border-radius:30px;
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.3),
      inset 0 -12px 20px -6px rgba(0,0,0,.25),
      0 20px 40px -16px rgba(0,0,0,.4),
      0 4px 14px rgba(0,0,0,.2);
    overflow:hidden;
  }
  .timer-dock::before{
    content:"";
    position:absolute; top:0; left:6%; right:6%; height:50%;
    border-radius:40px 40px 100% 100%/60px 60px 100% 100%;
    background:linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0));
    pointer-events:none;
  }
  .timer-bar{ position:relative; z-index:2; display:flex; align-items:center; gap:10px;}
  .ring-wrap{ position:relative; width:40px; height:40px; flex:0 0 auto;}
  .ring-wrap svg{ transform:rotate(-90deg);}
  .ring-bg{ fill:none; stroke:rgba(255,255,255,.35); stroke-width:4;}
  .ring-fg{ fill:none; stroke:#fff; stroke-width:4; stroke-linecap:round; stroke-dasharray:107; stroke-dashoffset:107; transition:stroke .2s ease;}
  .ring-wrap .center-dot{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  .center-dot .pulse{ width:7px;height:7px;border-radius:50%; background:#fff;}
  .center-dot .pulse.running{ animation:pulse 1s ease-in-out infinite; background:#E14B4B;}
  @keyframes pulse{ 0%,100%{box-shadow:0 0 0 0 rgba(225,75,75,.45);} 50%{box-shadow:0 0 0 6px rgba(225,75,75,0);} }
  .timer-mid{ flex:1; line-height:1.1;}
  .timer-mid .t-label{ font-size:10px; font-weight:800; letter-spacing:.06em; color:rgba(255,255,255,.75); text-transform:uppercase;}
  .timer-mid .t-time{ font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:1px; color:#fff;}
  .timer-actions{ display:flex; gap:8px;}
  .t-btn{
    position:relative; width:46px;height:46px;border-radius:16px; border:1px solid var(--glass-border);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px;
    transition:transform .15s ease, background .2s ease; overflow:hidden;
  }
  .t-btn:active{ transform:scale(.85); }
  .t-btn.reset{
    background:linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.02));
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    color:#fff;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.25);
  }
  .t-btn.reset:active{ transform:scale(.85) rotate(-45deg); }
  .t-btn.toggle{
    background:linear-gradient(160deg, #ffffff, #EDEEF3);
    color:var(--pill-dark); font-weight:900; border:1px solid rgba(255,255,255,.8);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.9), 0 6px 14px -6px rgba(0,0,0,.4);
  }
  .t-btn.toggle.is-running{
    background:linear-gradient(160deg, #E14B4B, #C43A3A); color:#fff; animation:togglePop .3s ease;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.35), 0 6px 14px -6px rgba(0,0,0,.4);
  }
  .t-btn.quick{
    width:auto; min-width:52px; height:46px; padding:0 10px;
    background:linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.02));
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    color:#fff; font-size:15px; font-weight:800;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.25);
  }
  .t-btn.quick.is-running{
    background:linear-gradient(160deg, #F3B23E, #E19A22); color:#fff; animation:togglePop .3s ease;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.35);
  }
  @keyframes togglePop{ 0%{ transform:scale(.85); } 55%{ transform:scale(1.08); } 100%{ transform:scale(1); } }

  /* ---------- countdown overlay (center screen, last seconds) ---------- */
  .countdown-overlay{
    position:absolute; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:rgba(8,8,10,.62);
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .countdown-overlay.show{ opacity:1; }
  .countdown-viewport{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    height:180px;
  }
  .digit-slot{
    position:relative;
    width:100px; height:180px;
    overflow:hidden;
    transition:width .25s ease, opacity .25s ease, margin .25s ease;
  }
  .digit-slot.hidden{ width:0; opacity:0; margin:0; }
  .countdown-num{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:140px; font-weight:900; color:#fff;
    font-variant-numeric:tabular-nums;
    text-shadow:0 8px 30px rgba(0,0,0,.4);
    transition:transform .32s cubic-bezier(.32,.9,.35,1), opacity .32s ease;
  }
  .countdown-num.cd-enter{ transform:translateY(115%); opacity:0; }
  .countdown-num.cd-leave{ transform:none; opacity:0; transition:opacity .16s ease; }

</style>
</head>
<body>

<div class="phone-shell">
  <div class="bg-blobs"><span></span><span></span><span></span><span></span></div>
  <div class="screens">

    <!-- HOME -->
    <h1 class="page-title">Mon Programme</h1>
    <div class="date-strip" id="dateStrip"></div>

    <div class="section-label">Séance du jour</div>
    <div id="featuredCard"></div>

    <!-- INLINE DETAIL (shows the selected day right below) -->
    <div class="inline-detail" id="inlineDetail"></div>

  </div>

  <!-- CHRONO -->
  <div class="timer-dock">
    <div class="timer-bar">
      <div class="ring-wrap">
        <svg width="40" height="40" viewBox="0 0 40 40">
          <circle class="ring-bg" cx="20" cy="20" r="17"></circle>
          <circle class="ring-fg" id="ringFg" cx="20" cy="20" r="17"></circle>
        </svg>
        <div class="center-dot"><div class="pulse" id="pulseDot"></div></div>
      </div>
      <div class="timer-mid">
        <div class="t-label" id="timerLabel">Chrono séance</div>
        <div class="t-time" id="timeDisplay">00:00</div>
      </div>
      <div class="timer-actions">
        <button class="t-btn quick" id="quickBtn30" onclick="startQuickTimer(25)">25s</button>
        <button class="t-btn quick" id="quickBtn20" onclick="startQuickTimer(15)">15s</button>
        <button class="t-btn reset" onclick="resetTimer()">↺</button>
        <button class="t-btn toggle" id="toggleBtn" onclick="toggleTimer()">▶</button>
      </div>
    </div>
  </div>

  <!-- COUNTDOWN OVERLAY (10, 9, 8... plein écran) -->
  <div class="countdown-overlay" id="countdownOverlay">
    <div class="countdown-viewport" id="countdownViewport">
      <div class="digit-slot hidden" id="digitTens"></div>
      <div class="digit-slot" id="digitUnits"></div>
    </div>
  </div>
</div>

<script>
  // ---------- Photos (Unsplash, libres de droits) ----------
  const IMG_PRESS   = "https://images.unsplash.com/photo-1653773869760-5b0f846231fb?w=800&q=70&auto=format&fit=crop";
  const IMG_MILPRESS= "https://images.unsplash.com/photo-1692372372344-41aed374b848?w=800&q=70&auto=format&fit=crop";
  const IMG_BACK    = "https://images.unsplash.com/photo-1758223521209-f70658aa6bb6?w=800&q=70&auto=format&fit=crop";
  const IMG_SHOULD  = "https://images.unsplash.com/photo-1641337221253-fdc7237f6b61?w=800&q=70&auto=format&fit=crop";

  // ---------- Photos par jour (Unsplash) ----------
  const IMG_LUN = "https://images.unsplash.com/photo-1605296867304-46d5465a13f1?w=800&q=70&auto=format&fit=crop";
  const IMG_MAR = "https://images.unsplash.com/photo-1548690312-e3b507d8c110?w=800&q=70&auto=format&fit=crop";
  const IMG_MER = "https://images.unsplash.com/photo-1595078475328-1ab05d0a6a0e?w=800&q=70&auto=format&fit=crop";
  const IMG_JEU = "https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=800&q=70&auto=format&fit=crop";
  const IMG_VEN = "https://images.unsplash.com/photo-1521804906057-1df8fdb718b7?w=800&q=70&auto=format&fit=crop";

        {name:'Record temps : 100 pompes', sets:'Chrono', img:IMG_PUSHUP},
      ]},
    { key:'jeu', abbr:'Jeu', num:4, name:'Jeudi', focus:'Pecs + Épaules Volume + Abdos', color:'#DCF3E4', tag:'#B9E7C9', photo:IMG_JEU,
      abdoVideo:{title:'Abdos', id:'an4437zDkmU'},
      exercises:[
        {name:'Développé incliné', sets:'4×10-12', img:EX1},
        {name:'Développé couché', sets:'4×10', img:EX_DEV},
        {name:'Shoulder Press', sets:'4×10', img:EX2},
        {name:'Élévations latérales', sets:'5×20', img:EX8},
        {name:'Sit-up', sets:'3×15-20', img:EX12},
      ]},
    { key:'ven', abbr:'Ven', num:5, name:'Vendredi', focus:'Dos + Trapèzes + Abdos', color:'#E6DFF7', tag:'#CDC0EF', photo:IMG_VEN,
      abdoVideo:{title:'Abdos', id:'an4437zDkmU'},
      exercises:[
        {name:'Rowing Gauche MPC', sets:'4×8-12', img:EX10},
        {name:'Rowing Droite MPC', sets:'4×8-12', img:EX10},
        {name:'Shrugs', sets:'5×15', img:EX11},
        {name:'Curl biceps', sets:'3×12', img:EX_BIC},
        {name:'Sit-up', sets:'3×15-20', img:EX12, abdo:true},
      ]},
    { key:'sam', abbr:'Sam', num:6, name:'Samedi', focus:'Full Haut du Corps', color:'#FBE3CF', tag:'#F2C8A0', photo:IMG_SAM,
      abdoVideo:{title:'Abdos', id:'an4437zDkmU'},
      exercises:[
        {name:'Développé couché', sets:'4×8', img:EX_DEV},
        {name:'Shoulder Press', sets:'4×8', img:EX2},
        {name:'Rowing Gauche MPC', sets:'4×10', img:EX10},
        {name:'Rowing Droite MPC', sets:'4×10', img:EX10},
        {name:'Élévations latérales', sets:'4×20', img:EX8},
        {name:'Dips', sets:'3×Max', img:EX7},
      ]},
    { key:'dim', abbr:'Dim', num:7, name:'Dimanche', focus:'Record poids machine', color:'#E7E8ED', tag:'#D3D5DC', photo:IMG_DIM,
      abdoVideo:{title:'Abdos', id:'mUI4hXTmAkw'},
      exercises:[
        {name:'Record poids : Développé couché', sets:'Max', img:EX_DEV},
      ]},
  ];

  const JS_DAY_TO_KEY = ['dim','lun','mar','mer','jeu','ven','sam'];
  const todayKey = JS_DAY_TO_KEY[new Date().getDay()];
  let selectedKey = todayKey;

  // ---------- attribution des vraies dates du jour à chaque jour de la semaine ----------
  function getMonday(d){
    d = new Date(d);
    const day = d.getDay();
    const diff = (day === 0 ? -6 : 1) - day;
    d.setDate(d.getDate() + diff);
    return d;
  }
  const monday = getMonday(new Date());
  DAYS.forEach((d, i)=>{
    const dt = new Date(monday);
    dt.setDate(monday.getDate() + i);
    d.date = dt;
  });

  // ---------- date strip ----------
  const dateStrip = document.getElementById('dateStrip');
  function renderDateStrip(){
    dateStrip.innerHTML = '';
    DAYS.forEach(d=>{
      const chip = document.createElement('button');
      chip.className = 'date-chip' + (d.key===selectedKey ? ' active' : '');
      chip.innerHTML = `<span class="dnum">${d.date.getDate()}</span><span class="dabbr">${d.abbr}</span>`;
      chip.onclick = ()=>{ selectedKey = d.key; renderDateStrip(); renderFeatured(); showDetail(d.key); };
      dateStrip.appendChild(chip);
    });
  }

  // ---------- featured card (home) ----------
  const featuredCard = document.getElementById('featuredCard');
  function renderFeatured(){
    const d = DAYS.find(x=>x.key===selectedKey);
    const idx = DAYS.findIndex(x=>x.key===selectedKey);
    const pct = Math.round(((idx+1)/7)*100);
    featuredCard.innerHTML = `
      <div class="feat-card" onclick="showDetail('${d.key}')">
        <div class="photo" style="background-image:url('${d.photo}')"></div>
        <div class="corner-stats">
          <div class="corner-pct">${pct}%</div>
          <div class="corner-exo">${d.exercises.length ? d.exercises.length+' exos' : 'Vidéo guidée'}</div>
        </div>
        <div>
          <div class="kicker">${d.name}</div>
          <div class="ftitle">${getFocus(d)}</div>
        </div>
      </div>`;
  }

  // ---------- inline detail ----------
  function showDetail(key){
    const d = DAYS.find(x=>x.key===key);
    let html = '';
    if(d.exercises.length){
      html += `<div class="section-label" style="margin-top:0;">Exercices</div><div class="ex-grid">`;
      d.exercises.forEach(ex=>{
        const flip = ex.name.includes('Droite');
        html += `<div class="ex-tile">
          <div class="ex-tile-bg" style="background-image:url('${ex.img}');${flip ? 'transform:scaleX(-1);' : ''}"></div>
          <div class="badge">${ex.sets}</div>
          <div class="nm">${ex.name}</div>
        </div>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="rest-note">Pas d'exercices musculation aujourd'hui — lance la vidéo ci-dessous et laisse tourner le chrono séance pendant ta séance.</div>`;
    }
    if(d.video){
      html += `<div class="video-card">
        <div class="video-frame-wrap" id="vidWrap-${d.key}" onclick="playVideo('${d.key}','${d.video.id}')">
          <img src="https://img.youtube.com/vi/${d.video.id}/hqdefault.jpg" alt="${d.video.title}">
          <div class="play-btn"></div>
        </div>
        <div class="video-meta">
          <div class="vt">${d.video.title}</div>
          <div class="vtag">Lecture intégrée</div>
        </div>
      </div>`;
    }
    if(d.abdoVideo){
      html += `<div class="video-card">
        <div class="video-frame-wrap" id="vidWrap-${d.key}-abdo" onclick="playVideo('${d.key}-abdo','${d.abdoVideo.id}')">
          <img src="https://img.youtube.com/vi/${d.abdoVideo.id}/hqdefault.jpg" alt="${d.abdoVideo.title}">
          <div class="play-btn"></div>
        </div>
        <div class="video-meta">
          <div class="vt">${d.abdoVideo.title}</div>
          <div class="vtag">Lecture intégrée</div>
        </div>
      </div>`;
    }
    document.getElementById('inlineDetail').innerHTML = html;
    document.getElementById('inlineDetail').scrollIntoView({behavior:'smooth', block:'start'});
  }

  function playVideo(key, id){
    const wrap = document.getElementById('vidWrap-'+key);
    wrap.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0" title="video" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  }

  renderDateStrip();
  renderFeatured();
  showDetail(selectedKey);

  // ---------- Chrono séance ----------
  let seconds = 0, running = false, intervalId = null;
  const timeDisplay = document.getElementById('timeDisplay');
  const toggleBtn = document.getElementById('toggleBtn');
  const pulseDot = document.getElementById('pulseDot');
  const ringFg = document.getElementById('ringFg');
  const timerLabel = document.getElementById('timerLabel');
  const quickBtn30 = document.getElementById('quickBtn30');
  const quickBtn20 = document.getElementById('quickBtn20');
  const RING_C = 107; // circumference for r=17

  function fmt(s){
    const m = Math.floor(s/60).toString().padStart(2,'0');
    const sec = (s%60).toString().padStart(2,'0');
    return `${m}:${sec}`;
  }
  function render(){
    timeDisplay.textContent = fmt(seconds);
    const cycle = seconds % 60;
    const frac = cycle/60;
    ringFg.style.strokeDashoffset = RING_C - frac*RING_C;
  }
  function toggleTimer(){
    running = !running;
    toggleBtn.textContent = running ? '❚❚' : '▶';
    toggleBtn.classList.toggle('is-running', running);
    pulseDot.classList.toggle('running', running);
    if(running){ intervalId = setInterval(()=>{ seconds++; render(); }, 1000); }
    else { clearInterval(intervalId); }
  }
  function resetTimer(){
    seconds = 0; running = false; clearInterval(intervalId);
    toggleBtn.textContent = '▶'; toggleBtn.classList.remove('is-running');
    pulseDot.classList.remove('running'); render();
  }
  render();

  // ---------- Minuteur rapide 30s/20s avec sonnerie (indépendant du chrono séance) ----------
  let quickRunning = false, quickInterval = null, quickActiveBtn = null, quickDuration = null;

  function beep(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      // petit arpège ascendant façon notification moderne
      const notes = [740, 932.33, 1174.66, 1567.98]; // F#5, A#5, D6, G6
      notes.forEach((freq, i)=>{
        const t = now + i*0.11;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filt = ctx.createBiquadFilter();
        filt.type = 'lowpass';
        filt.frequency.value = 4000;
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.28, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
        osc.connect(filt); filt.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.5);
      });
    }catch(e){}
  }

  const countdownOverlay = document.getElementById('countdownOverlay');
  const digitSlots = {
    tens:  { el: document.getElementById('digitTens'),  current: null, currentEl: null },
    units: { el: document.getElementById('digitUnits'), current: null, currentEl: null }
  };

  function setDigit(slot, char){
    if(char === null){
      // pas de dizaine à afficher (nombre à 1 chiffre) : on masque proprement le slot
      if(slot.current !== null){
        slot.el.classList.add('hidden');
        if(slot.currentEl){ slot.currentEl.remove(); slot.currentEl = null; }
        slot.current = null;
      }
      return;
    }
    slot.el.classList.remove('hidden');
    if(slot.current === char) return; // chiffre inchangé : il reste immobile, aucune animation

    // seul CE chiffre bouge : l'ancien disparaît sur place, le nouveau glisse depuis le bas
    const leaving = slot.currentEl;
    if(leaving){
      leaving.classList.add('cd-leave');
      setTimeout(()=>{ leaving.remove(); }, 180);
    }
    const incoming = document.createElement('div');
    incoming.className = 'countdown-num cd-enter';
    incoming.textContent = char;
    slot.el.appendChild(incoming);
    void incoming.offsetWidth; // reflow pour activer la transition
    incoming.classList.remove('cd-enter');
    slot.current = char;
    slot.currentEl = incoming;
  }

  function showCountdown(n){
    countdownOverlay.classList.add('show');
    const str = String(n);
    if(str.length > 1){
      setDigit(digitSlots.tens, str[0]);
      setDigit(digitSlots.units, str[1]);
    } else {
      setDigit(digitSlots.tens, null);
      setDigit(digitSlots.units, str[0]);
    }
  }
  function hideCountdown(){
    countdownOverlay.classList.remove('show');
  }

  function startQuickTimer(duration){
    const btn = duration === 15 ? quickBtn20 : quickBtn30;

    if(quickRunning){
      if(quickActiveBtn === btn){
        // deuxième clic sur le même bouton pendant le décompte = annuler
        clearInterval(quickInterval);
        quickRunning = false;
        btn.classList.remove('is-running');
        btn.textContent = duration + 's';
        hideCountdown();
        quickActiveBtn = null;
        return;
      }
      // clic sur l'autre bouton = on bascule dessus
      clearInterval(quickInterval);
      quickActiveBtn.classList.remove('is-running');
      quickActiveBtn.textContent = quickDuration + 's';
    }

    quickRunning = true;
    quickDuration = duration;
    quickActiveBtn = btn;
    btn.classList.add('is-running');

    let remaining = duration;
    btn.textContent = remaining + 's';
    showCountdown(remaining); // affiche tout de suite le décompte, dès le départ

    quickInterval = setInterval(()=>{
      remaining--;
      btn.textContent = remaining > 0 ? remaining + 's' : duration + 's';

      if(remaining > 0){
        showCountdown(remaining);
      } else {
        clearInterval(quickInterval);
        quickRunning = false;
        btn.classList.remove('is-running');
        btn.textContent = duration + 's';
        hideCountdown();
        quickActiveBtn = null;
        beep();
      }
    }, 1000);
  }
</script>
