<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Mon Programme</title>
<style>
  :root{
    --bg:#EDEEF3;
    --shell:#FFFFFF;
    --ink:#14151A;
    --muted:#8A8D98;
    --line:#EEEEF2;
    --grey-card:#F2F2F6;
    --pill-dark:#14151A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% -10%, #ffffff 0%, var(--bg) 55%);
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:26px 12px;
  }

  .phone-shell{
    width:100%;
    max-width:430px;
    background:var(--shell);
    border-radius:36px;
    box-shadow:0 30px 60px -25px rgba(20,21,26,.28), 0 2px 8px rgba(20,21,26,.06);
    overflow:hidden;
    position:relative;
    min-height:780px;
    display:flex;
    flex-direction:column;
  }

  .screens{
    flex:1;
    overflow-y:auto;
    padding:24px 20px 100px;
  }
  .screens::-webkit-scrollbar{display:none;}

  /* ---------- shared bits ---------- */
  .top-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:20px;
  }
  .avatar{
    width:42px;height:42px;border-radius:50%;
    background:linear-gradient(145deg,#FFB199,#FF6B6B);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:15px;
  }
  .icon-btn{
    width:38px;height:38px;border-radius:50%;
    background:var(--grey-card);
    display:flex;align-items:center;justify-content:center;
    border:none; cursor:pointer; color:var(--ink);
    font-size:16px;
  }
  .icon-row{display:flex; gap:8px;}
  .back-link{
    display:flex; align-items:center; gap:4px;
    background:none; border:none; cursor:pointer;
    color:#3E7BFA; font-weight:700; font-size:15px;
    padding:0; margin-bottom:18px;
  }
  h1.page-title{ font-size:24px; font-weight:800; margin:0 0 16px; letter-spacing:-0.01em;}
  .section-label{ font-size:13px; color:var(--muted); font-weight:600; margin:20px 2px 10px;}

  /* ---------- date strip ---------- */
  .date-strip{ display:flex; gap:8px; margin-bottom:20px; }
  .date-chip{
    flex:1;
    background:var(--grey-card);
    border-radius:16px;
    padding:10px 0 9px;
    text-align:center;
    cursor:pointer;
    border:none;
  }
  .date-chip .dnum{ font-size:16px; font-weight:800; display:block; color:var(--ink);}
  .date-chip .dabbr{ font-size:10.5px; color:var(--muted); font-weight:600; margin-top:1px; display:block;}
  .date-chip.active{ background:var(--pill-dark); }
  .date-chip.active .dnum, .date-chip.active .dabbr{ color:#fff; }

  /* ---------- greeting card ---------- */
  .greet-card{
    background:var(--grey-card);
    border-radius:20px;
    padding:16px 18px;
    margin-bottom:22px;
  }
  .greet-card .hi{ font-weight:800; font-size:15px; margin:0 0 6px;}
  .greet-card p{ margin:0; font-size:13.5px; color:#54565F; line-height:1.5;}

  /* ---------- featured / day pastel cards ---------- */
  .feat-card{
    position:relative;
    border-radius:24px;
    padding:20px 20px 22px;
    overflow:hidden;
    min-height:168px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    margin-bottom:14px;
    cursor:pointer;
  }
  .feat-card .photo{
    position:absolute; right:0; top:0; bottom:0; width:46%;
    background-size:cover; background-position:center 20%;
    -webkit-mask-image:linear-gradient(to right, transparent 0%, #000 42%);
    mask-image:linear-gradient(to right, transparent 0%, #000 42%);
  }
  .feat-card .kicker{ font-size:11.5px; font-weight:700; color:#54565F; text-transform:uppercase; letter-spacing:.04em; position:relative; z-index:2;}
  .feat-card .ftitle{ font-size:21px; font-weight:800; margin:4px 0 12px; max-width:62%; line-height:1.15; position:relative; z-index:2;}
  .feat-card .frow{ display:flex; align-items:center; gap:10px; position:relative; z-index:2;}
  .ring-mini{ position:relative; width:44px;height:44px; flex:0 0 auto;}
  .ring-mini svg{ transform:rotate(-90deg);}
  .ring-mini .rbg{ fill:none; stroke:rgba(20,21,26,.14); stroke-width:4;}
  .ring-mini .rfg{ fill:none; stroke:var(--ink); stroke-width:4; stroke-linecap:round;}
  .ring-mini .rlabel{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:800;}
  .pill-tag{
    background:rgba(20,21,26,.1);
    padding:6px 12px; border-radius:999px;
    font-size:12px; font-weight:700; color:var(--ink);
  }

  .btn-dark{
    background:var(--pill-dark); color:#fff; border:none;
    width:100%; padding:16px; border-radius:18px;
    font-size:15.5px; font-weight:800; cursor:pointer;
    margin-top:6px;
  }
  .btn-link-quiet{
    display:block; text-align:center; margin-top:12px;
    background:none; border:none; color:var(--muted);
    font-weight:700; font-size:13.5px; cursor:pointer;
  }

  /* ---------- search ---------- */
  .search-bar{
    display:flex; align-items:center; gap:8px;
    background:var(--grey-card); border-radius:16px;
    padding:12px 14px; margin-bottom:18px;
  }
  .search-bar input{
    border:none; background:none; outline:none;
    font-size:14px; width:100%; color:var(--ink); font-family:inherit;
  }
  .search-bar input::placeholder{ color:#A2A5AF; }

  /* list card variant (smaller than featured) */
  .list-card{ min-height:120px; }
  .list-card .ftitle{ font-size:18px; margin:2px 0 10px;}

  /* ---------- detail screen ---------- */
  .hero-strip{
    border-radius:22px;
    padding:20px;
    margin-bottom:6px;
    position:relative;
    overflow:hidden;
    min-height:120px;
  }
  .hero-strip .photo{
    position:absolute; right:0; top:0; bottom:0; width:44%;
    background-size:cover; background-position:center 20%;
    -webkit-mask-image:linear-gradient(to right, transparent 0%, #000 42%);
    mask-image:linear-gradient(to right, transparent 0%, #000 42%);
  }
  .hero-strip .hname{ font-size:22px; font-weight:800; position:relative; z-index:2; max-width:60%;}
  .hero-strip .hfocus{ font-size:13px; font-weight:600; color:#54565F; margin-top:4px; position:relative; z-index:2; max-width:60%;}

  .ex-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px;}
  .ex-tile{
    position:relative; border-radius:18px; overflow:hidden;
    aspect-ratio:1/1.05;
    display:flex; align-items:flex-end; border:1px solid var(--line);
  }
  .ex-tile-bg{
    position:absolute; inset:0;
    background-size:cover; background-position:center;
  }
  .ex-tile::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(20,21,26,0) 32%, rgba(20,21,26,.55) 68%, rgba(20,21,26,.9) 100%);
  }
  .ex-tile .badge{
    position:absolute; top:9px; right:9px; z-index:2;
    background:rgba(255,255,255,.92); color:var(--ink);
    font-size:11px; font-weight:800; padding:4px 8px; border-radius:8px;
  }
  .ex-tile .nm{ position:relative; z-index:2; padding:0 10px 12px; color:#fff; font-size:12.5px; font-weight:800; text-transform:uppercase; line-height:1.2;}

  .video-card{ border-radius:18px; overflow:hidden; border:1px solid var(--line); background:#fff; margin:14px 0 6px;}
  .video-frame-wrap{ position:relative; width:100%; aspect-ratio:16/9; background:#000; cursor:pointer;}
  .video-frame-wrap img{ width:100%; height:100%; object-fit:cover; display:block; opacity:.8;}
  .video-frame-wrap iframe{ position:absolute; inset:0; width:100%; height:100%; border:none;}
  .play-btn{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:54px; height:54px; border-radius:50%; background:rgba(255,255,255,.9); display:flex; align-items:center; justify-content:center;}
  .play-btn::before{ content:""; border-style:solid; border-width:9px 0 9px 15px; border-color:transparent transparent transparent var(--ink); margin-left:4px;}
  .video-meta{ padding:12px 14px 14px; display:flex; align-items:center; justify-content:space-between;}
  .video-meta .vt{ font-weight:800; font-size:14px;}
  .video-meta .vtag{ font-size:10.5px; font-weight:800; letter-spacing:.04em; color:#fff; background:var(--ink); padding:4px 8px; border-radius:7px; text-transform:uppercase;}

  .rest-note{ margin-top:16px; background:var(--grey-card); border-radius:16px; padding:16px; font-size:13px; color:#54565F; font-weight:600; line-height:1.5;}

  /* ---------- inline detail section ---------- */
  .inline-detail{ margin-top:22px; padding-top:18px; border-top:1px solid var(--line); }

  /* ---------- timer dock (fixed at bottom) ---------- */
  .timer-dock{
    position:absolute; left:0; right:0; bottom:0; z-index:20;
    padding:12px 20px calc(14px + env(safe-area-inset-bottom));
    background:#fff;
    border-top:1px solid var(--line);
    box-shadow:0 -6px 16px -10px rgba(20,21,26,.18);
  }
  .timer-bar{ display:flex; align-items:center; gap:12px;}
  .ring-wrap{ position:relative; width:46px; height:46px; flex:0 0 auto;}
  .ring-wrap svg{ transform:rotate(-90deg);}
  .ring-bg{ fill:none; stroke:var(--line); stroke-width:5;}
  .ring-fg{ fill:none; stroke:var(--ink); stroke-width:5; stroke-linecap:round; stroke-dasharray:128; stroke-dashoffset:128; transition:stroke .2s ease;}
  .ring-wrap .center-dot{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  .center-dot .pulse{ width:8px;height:8px;border-radius:50%; background:var(--ink);}
  .center-dot .pulse.running{ animation:pulse 1s ease-in-out infinite; background:#E14B4B;}
  @keyframes pulse{ 0%,100%{box-shadow:0 0 0 0 rgba(225,75,75,.45);} 50%{box-shadow:0 0 0 6px rgba(225,75,75,0);} }
  .timer-mid{ flex:1; line-height:1.1;}
  .timer-mid .t-label{ font-size:10.5px; font-weight:800; letter-spacing:.06em; color:var(--muted); text-transform:uppercase;}
  .timer-mid .t-time{ font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:1px;}
  .timer-actions{ display:flex; gap:8px;}
  .t-btn{ width:40px;height:40px;border-radius:13px; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px;}
  .t-btn.reset{ background:var(--grey-card); color:var(--ink);}
  .t-btn.toggle{ background:var(--ink); color:#fff; font-weight:900;}
  .t-btn.toggle.is-running{ background:#E14B4B;}

</style>
</head>
<body>

<div class="phone-shell">
  <div class="screens">

    <!-- HOME -->
    <div class="top-row">
      <div class="avatar">👤</div>
      <div class="icon-row">
        <button class="icon-btn">💬</button>
        <button class="icon-btn">🔔</button>
      </div>
    </div>
    <h1 class="page-title">Mon Programme</h1>
    <div class="date-strip" id="dateStrip"></div>

    <div class="section-label">Séance du jour</div>
    <div id="featuredCard"></div>

    <!-- INLINE DETAIL (shows the selected day right below) -->
    <div class="inline-detail" id="inlineDetail"></div>

  </div>

  <!-- CHRONO -->
  <div class="timer-dock">
    <div class="timer-bar">
      <div class="ring-wrap">
        <svg width="46" height="46" viewBox="0 0 46 46">
          <circle class="ring-bg" cx="23" cy="23" r="20.5"></circle>
          <circle class="ring-fg" id="ringFg" cx="23" cy="23" r="20.5"></circle>
        </svg>
        <div class="center-dot"><div class="pulse" id="pulseDot"></div></div>
      </div>
      <div class="timer-mid">
        <div class="t-label">Chrono séance</div>
        <div class="t-time" id="timeDisplay">00:00</div>
      </div>
      <div class="timer-actions">
        <button class="t-btn reset" onclick="resetTimer()">↺</button>
        <button class="t-btn toggle" id="toggleBtn" onclick="toggleTimer()">▶</button>
      </div>
    </div>
  </div>
</div>

  const DAYS = [

      exercises:[
        {name:'Développé incliné', sets:'4×10-12', img:EX1},
        {name:'Développé couché', sets:'4×10', img:EX3},
        {name:'Shoulder Press', sets:'4×10', img:EX2},

    { key:'ven', abbr:'Ven', num:5, name:'Vendredi', focus:'Dos + Trapèzes + Abdos', color:'#E6DFF7', tag:'#CDC0EF', photo:IMG_VEN,

      exercises:[]},
  ];

  const JS_DAY_TO_KEY = ['dim','lun','mar','mer','jeu','ven','sam'];
  const todayKey = JS_DAY_TO_KEY[new Date().getDay()];
  let selectedKey = todayKey;

  // ---------- date strip ----------
  const dateStrip = document.getElementById('dateStrip');
  function renderDateStrip(){
    dateStrip.innerHTML = '';
    DAYS.forEach(d=>{
      const chip = document.createElement('button');
      chip.className = 'date-chip' + (d.key===selectedKey ? ' active' : '');
      chip.innerHTML = `<span class="dnum">${d.num}</span><span class="dabbr">${d.abbr}</span>`;
      chip.onclick = ()=>{ selectedKey = d.key; renderDateStrip(); renderFeatured(); showDetail(d.key); };
      dateStrip.appendChild(chip);
    });
  }

  // ---------- featured card (home) ----------
  const featuredCard = document.getElementById('featuredCard');
  function ringSvg(pct, size=44, r=19){
    const c = 2*Math.PI*r;
    const off = c - (pct/100)*c;
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle class="rbg" cx="${size/2}" cy="${size/2}" r="${r}"></circle>
      <circle class="rfg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${off}"></circle>
    </svg>`;
  }
  function renderFeatured(){
    const d = DAYS.find(x=>x.key===selectedKey);
    const idx = DAYS.findIndex(x=>x.key===selectedKey);
    const pct = Math.round(((idx+1)/7)*100);
    featuredCard.innerHTML = `
      <div class="feat-card" style="background:${d.color}" onclick="showDetail('${d.key}')">
        <div class="photo" style="background-image:url('${d.photo}')"></div>
        <div>
          <div class="kicker">${d.name}</div>
          <div class="ftitle">${d.focus}</div>
        </div>
        <div class="frow">
          <div class="ring-mini">${ringSvg(pct)}<div class="rlabel">${pct}%</div></div>
          <div class="pill-tag">${d.exercises.length ? d.exercises.length+' exercices' : 'Vidéo guidée'}</div>
        </div>
      </div>`;
  }

  // ---------- inline detail ----------
  function showDetail(key){
    const d = DAYS.find(x=>x.key===key);
    let html = '';
    if(d.video){
      html += `<div class="video-card">
        <div class="video-frame-wrap" id="vidWrap-${d.key}" onclick="playVideo('${d.key}','${d.video.id}')">
          <img src="https://img.youtube.com/vi/${d.video.id}/hqdefault.jpg" alt="${d.video.title}">
          <div class="play-btn"></div>
        </div>
        <div class="video-meta">
          <div class="vt">${d.video.title}</div>
          <div class="vtag">Lecture intégrée</div>
        </div>
      </div>`;
    }
    if(d.exercises.length){
      html += `<div class="section-label" style="margin-top:16px;">Exercices</div><div class="ex-grid">`;
      d.exercises.forEach(ex=>{
        const flip = ex.name.includes('Droite');
        html += `<div class="ex-tile">
          <div class="ex-tile-bg" style="background-image:url('${ex.img}');${flip ? 'transform:scaleX(-1);' : ''}"></div>
          <div class="badge">${ex.sets}</div>
          <div class="nm">${ex.name}</div>
        </div>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="rest-note">Pas d'exercices musculation aujourd'hui — lance la vidéo ci-dessus et laisse tourner le chrono séance pendant ta séance.</div>`;
    }
    document.getElementById('inlineDetail').innerHTML = html;
    document.getElementById('inlineDetail').scrollIntoView({behavior:'smooth', block:'start'});
  }

  function playVideo(key, id){
    const wrap = document.getElementById('vidWrap-'+key);
    wrap.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0" title="video" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  }

  renderDateStrip();
  renderFeatured();
  showDetail(selectedKey);

  // ---------- Chrono séance ----------
  let seconds = 0, running = false, intervalId = null;
  const timeDisplay = document.getElementById('timeDisplay');
  const toggleBtn = document.getElementById('toggleBtn');
  const pulseDot = document.getElementById('pulseDot');
  const ringFg = document.getElementById('ringFg');

  function fmt(s){
    const m = Math.floor(s/60).toString().padStart(2,'0');
    const sec = (s%60).toString().padStart(2,'0');
    return `${m}:${sec}`;
  }
  function render(){
    timeDisplay.textContent = fmt(seconds);
    const cycle = seconds % 60;
    const frac = cycle/60;
    ringFg.style.strokeDashoffset = 128 - frac*128;
  }
  function toggleTimer(){
    running = !running;
    toggleBtn.textContent = running ? '❚❚' : '▶';
    toggleBtn.classList.toggle('is-running', running);
    pulseDot.classList.toggle('running', running);
    if(running){ intervalId = setInterval(()=>{ seconds++; render(); }, 1000); }
    else { clearInterval(intervalId); }
  }
  function resetTimer(){
    seconds = 0; running = false; clearInterval(intervalId);
    toggleBtn.textContent = '▶'; toggleBtn.classList.remove('is-running');
    pulseDot.classList.remove('running'); render();
  }
  render();
</script>
